[workspace]
resolver = "2"
members = ["crates/hanzi-core", "crates/hanzi-store", "crates/hanzi-sync", "crates/hanzi-say", "src-tauri"]

[workspace.package]
version = "0.5.7"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Device and vocabulary identity for cross-device sync (ROADMAP M13). Randomness
# comes from `getrandom`, which is already in the graph through Tauri, so this
# adds a name to the manifest but no new upstream project to the build.
uuid = { version = "1", features = ["v4"] }
postcard = { version = "1", features = ["alloc"] }
flate2 = "1"

# Development builds are optimised a little even in debug so that grading a
# stroke feels instant while iterating.
[profile.dev.package."*"]
opt-level = 1

[profile.dev]
opt-level = 1
