[workspace]
resolver = "2"
members = ["crates/hanzi-core", "crates/hanzi-store", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
flate2 = "1"

# Development builds are optimised a little even in debug so that grading a
# stroke feels instant while iterating.
[profile.dev.package."*"]
opt-level = 1

[profile.dev]
opt-level = 1
