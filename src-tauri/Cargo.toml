[package]
name = "hanzi-tutor"
description = "Learn to read and write simplified Chinese characters"
version.workspace = true
edition.workspace = true
license.workspace = true

# A library target keeps the door open for mobile bundles later; the desktop
# binary is a thin wrapper around it.
#
# All three crate types are needed and each has exactly one consumer:
#
# - `staticlib` is what iOS links (the Xcode project's "Build Rust Code" phase
#   copies it in as `libapp.a`).
# - `cdylib` is what Android loads: Gradle's `rustBuild*` task runs
#   `tauri android android-studio-script`, which builds `libhanzi_tutor_lib.so`
#   and drops it into `jniLibs`. Without it `tauri android build` fails asking
#   for the `.so` — this is the "needs it back" note M9 left behind.
# - `rlib` is what the desktop binary links against.
#
# The tension to know about: cargo has no per-target `crate-type`, so the
# `cdylib` is built for the iOS target as well, where its link once failed with
# `symbol(s) not found for architecture arm64` for every Tauri Swift symbol
# (`_run_plugin_command`, `_register_plugin`, …) — the dylib link is handed the
# Swift search paths but not the `-lTauri` flags, and cargo treats that as fatal
# before Xcode ever runs. Nothing on iOS or macOS reads the dylib; only iOS
# *app* builds are at risk, and `cargo check --target aarch64-apple-ios` (which
# does not link) still passes. If an iOS device build trips over it again, the
# fix is to build that target's library explicitly rather than to drop `cdylib`
# here — dropping it breaks Android, which is the platform being worked on.
[lib]
name = "hanzi_tutor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Native open/save dialogs, for exporting and importing the vocabulary list.
tauri-plugin-dialog = "2"
# Opening the Dropbox authorization page in the *system browser* (ROADMAP M13).
# Deliberately not a webview, which is also why this is a plugin rather than
# `window.open`: Dropbox asks for the system browser, and Google's policy forbids
# their sign-in flow inside one, which matters for accounts that sign in to Dropbox
# through Google.
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
hanzi-core = { path = "../crates/hanzi-core" }
# The durable study store. Kept out of hanzi-core so the engine stays free of
# native dependencies and testable without a filesystem.
hanzi-store = { path = "../crates/hanzi-store" }
# Cross-device sync: the shard format, the merge, the fold and the Dropbox client.
hanzi-sync = { path = "../crates/hanzi-sync" }
# Microphone capture and system speech synthesis. Shared with the standalone
# tone trainer (`apps/tone-trainer`), which needs exactly these two things and
# nothing else from this binary.
hanzi-voice = { path = "../crates/hanzi-voice" }
# Speech recognition: *what* was said, as opposed to the tone it was said with.
# Shared with the standalone tone trainer, which offers the same optional model.
hanzi-hearing = { path = "../crates/hanzi-hearing" }
# Speech synthesis, for a phrase with no bundled recording (see `say.rs`). It
# shares `sherpa-onnx` with the recognition stack, so the voice that made the
# bundled clips is the voice the app speaks with, and no new native dependency
# enters the build.
hanzi-say = { path = "../crates/hanzi-say" }


# Fetching the synthesis model, and the toolkit that runs it — see `say.rs`.
# These three stayed here while recognition's copy of them moved to
# `hanzi-hearing`, because this app is the one that fetches *two* models.
#
# `sherpa-onnx`'s `sherpa-onnx-sys` build script downloads a prebuilt native
# archive from GitHub during `cargo build` unless `SHERPA_ONNX_LIB_DIR` is set, so
# it is set: scripts/fetch-sherpa.sh unpacks a digest-pinned copy and
# scripts/with-cargo-env.sh points the build at it.
sherpa-onnx = "1.13.8"
ureq = "2"
sha2 = "0.10"

# The refresh token has to outlive the process, and it is the whole of the account
# access this app has, so it goes in the platform's own secret store rather than in
# the study database — which is an ordinary file in an ordinary directory that
# backup tools copy around. Apple's Keychain is the same API on macOS and iOS; the
# crate is `#![cfg(target_vendor = "apple")]`, so this section is where it belongs.
#
# `OSX_10_15` is what exposes the data-protection keychain
# (`use_protected_keychain`), and that is the only keychain an access control can be
# attached to — so it is the only way to have macOS ask for a fingerprint rather
# than for the keychain password. Tauri 2 already requires 10.15, so this raises
# nothing.
[target.'cfg(target_vendor = "apple")'.dependencies]
security-framework = { version = "3", features = ["OSX_10_15"] }
