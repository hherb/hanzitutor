[package]
name = "hanzi-tutor"
description = "Learn to read and write simplified Chinese characters"
version.workspace = true
edition.workspace = true
license.workspace = true

# A library target keeps the door open for mobile bundles later; the desktop
# binary is a thin wrapper around it.
#
# All three crate types are needed and each has exactly one consumer:
#
# - `staticlib` is what iOS links (the Xcode project's "Build Rust Code" phase
#   copies it in as `libapp.a`).
# - `cdylib` is what Android loads: Gradle's `rustBuild*` task runs
#   `tauri android android-studio-script`, which builds `libhanzi_tutor_lib.so`
#   and drops it into `jniLibs`. Without it `tauri android build` fails asking
#   for the `.so` — this is the "needs it back" note M9 left behind.
# - `rlib` is what the desktop binary links against.
#
# The tension to know about: cargo has no per-target `crate-type`, so the
# `cdylib` is built for the iOS target as well, where its link once failed with
# `symbol(s) not found for architecture arm64` for every Tauri Swift symbol
# (`_run_plugin_command`, `_register_plugin`, …) — the dylib link is handed the
# Swift search paths but not the `-lTauri` flags, and cargo treats that as fatal
# before Xcode ever runs. Nothing on iOS or macOS reads the dylib; only iOS
# *app* builds are at risk, and `cargo check --target aarch64-apple-ios` (which
# does not link) still passes. If an iOS device build trips over it again, the
# fix is to build that target's library explicitly rather than to drop `cdylib`
# here — dropping it breaks Android, which is the platform being worked on.
[lib]
name = "hanzi_tutor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Native open/save dialogs, for exporting and importing the vocabulary list.
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
hanzi-core = { path = "../crates/hanzi-core" }
# The durable study store. Kept out of hanzi-core so the engine stays free of
# native dependencies and testable without a filesystem.
hanzi-store = { path = "../crates/hanzi-store" }
cpal = "0.18"

# Pronunciation on iOS goes through AVSpeechSynthesizer, in-process: there is no
# `say` binary there, and the app sandbox would refuse to spawn one anyway.
# `objc2` is already in the dependency tree through Tauri; this is the framework
# bindings for the one framework this project needs itself. `AVSpeechSynthesizer`
# lives in AVFAudio, which is the `objc2-avf-audio` crate rather than
# `objc2-av-foundation` (that one depends on this).
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-avf-audio = "0.3"
# AVFoundation's objects are not `Send`, so speaking happens on the main thread
# and this is how the work gets there.
dispatch2 = "0.3"
