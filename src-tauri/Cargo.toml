[package]
name = "hanzi-tutor"
description = "Learn to read and write simplified Chinese characters"
version.workspace = true
edition.workspace = true
license.workspace = true

# A library target keeps the door open for mobile bundles later; the desktop
# binary is a thin wrapper around it.
#
# `staticlib` is what iOS links (the Xcode project's "Build Rust Code" phase
# copies it in as `libapp.a`), `rlib` is what the desktop binary links against,
# and `cdylib` — which Tauri's template includes for Android's `.so` — is
# deliberately **not** built. On a device build its link fails with
# `symbol(s) not found for architecture arm64` for every Tauri Swift symbol
# (`_run_plugin_command`, `_register_plugin`, …): the dylib link is handed the
# Swift search paths but not the `-lTauri` flags, and cargo treats the failure as
# fatal and never reaches the Xcode step. Nothing on iOS or macOS reads the
# dylib. **Android work (the other half of M9) needs it back**, and the link
# flags will have to be looked at then.
[lib]
name = "hanzi_tutor_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Native open/save dialogs, for exporting and importing the vocabulary list.
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
hanzi-core = { path = "../crates/hanzi-core" }
# The durable study store. Kept out of hanzi-core so the engine stays free of
# native dependencies and testable without a filesystem.
hanzi-store = { path = "../crates/hanzi-store" }
