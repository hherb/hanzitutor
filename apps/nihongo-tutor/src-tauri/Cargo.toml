[package]
name = "nihongo-tutor"
description = "Learn to read and write Japanese kana"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# The same three crate types as the other two apps, for the same consumers:
# `staticlib` is what iOS links, `cdylib` is what Android loads, `rlib` is what
# the desktop binary links against.
[lib]
name = "nihongo_tutor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
# The kana dataset, the gojūon course, the romanisation and the romaji input
# engine. All of it is UI-free, so the whole interface below is testable without
# opening a window.
nihongo-core = { path = "../../../crates/nihongo-core" }
# Pronunciation, through the platform's own synthesiser — the same `Speaker` the
# two Hanzi Tutor apps use, told at construction that this one speaks Japanese.
# `default-features = false` is the whole reason that crate has the switch: its
# capture half carries `cpal`, and this app never opens a microphone.
hanzi-voice = { path = "../../../crates/hanzi-voice", default-features = false }
