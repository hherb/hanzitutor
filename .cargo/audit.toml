# `cargo audit`'s configuration, run from the repository root by `pnpm run
# audit:rust` and by the `audit` job in `.github/workflows/ci.yml`.
#
# Every advisory below is one this project cannot clear within the ranges its
# manifests ask for, and each group is recorded in prose with its measurements:
# `HANDOVER.md`'s "accepted dependency advisories" bullet and `HANDOVER_NIHONGO.md`
# §7, "The dependency advisories, and the warnings that stand". There are three
# groups, and none of them reaches a shipped Apple, Android or Windows binary.
#
# 1. `glib` and `proc-macro-error` — one chain, `glib ← atk ← gtk ← muda/tao ←
#    tauri`, and every link is behind `target_os = "linux"` (plus the BSDs), so
#    `cargo tree -i glib` prints nothing for the host target or for
#    `aarch64-apple-darwin`. The fix would be gtk-rs 0.20, and as of 15 October
#    2026 the newest released `muda` (0.21.2), `tao` (0.37.1) and `tauri` (2.12.4)
#    all still require `gtk ^0.18`. Revisit when the Linux milestone ships.
#
# 2. `zbus_names`, `zvariant`, `zvariant_derive` — unmaintained (16 October 2026),
#    and the same shape as group 1: they arrive only as `zbus 5 ←
#    tauri-plugin-opener`, behind the plugin's Linux target table, so `cargo tree
#    -i zbus_names` prints nothing for `aarch64-apple-darwin`, `aarch64-apple-ios`,
#    `aarch64-linux-android` or `x86_64-pc-windows-msvc`. zbus 6 moved off them,
#    but as of 7 November 2026 every released `tauri-plugin-opener` (2.7.2, and
#    3.0.0-alpha.3) still requires `zbus ^5.9`. Revisit with that plugin, or with
#    the Linux milestone.
#
# 3. `zip` 2.4.2 — four advisories about what `ZipArchive::extract` does with a
#    hostile archive (symlinks, Unix permissions, SUID bits, a large declared
#    size). It is a **build-dependency** of `sherpa-onnx-sys` 1.13.8 only, and that
#    build script calls it in one place: unpacking an iOS `.xcframework.zip` it has
#    just *downloaded*, inside `download_prebuilt_libs`. That path is never taken
#    here, because `scripts/with-cargo-env.sh` always sets `SHERPA_ONNX_LIB_DIR` to
#    the digest-pinned copy `scripts/fetch-sherpa.sh` unpacked, and
#    `resolve_lib_dir` returns before any download when it is set. The fix is
#    `sherpa-onnx` 2.x (whose `-sys` builds with `zip ^9`), which means re-recording
#    every pinned native archive in `fetch-sherpa.sh` on a trusted machine per
#    platform — a maintainer's step, not a lockfile update.
#
# Ignoring exactly these by id is what makes the rule worth running: with them
# ignored, every other advisory — and every *new* unmaintained or unsound warning,
# which is how all three groups arrived — fails `cargo audit -D warnings` and
# therefore the build, rather than scrolling past in a log.
[advisories]
ignore = [
    # 1. Linux GTK only
    "RUSTSEC-2024-0429", # glib 0.18.5 — unsound
    "RUSTSEC-2024-0370", # proc-macro-error 1.0.4 — unmaintained, via glib-macros
    # 2. Linux only, via zbus 5 ← tauri-plugin-opener
    "RUSTSEC-2026-0370", # zvariant 5.15.0 — unmaintained
    "RUSTSEC-2026-0371", # zbus_names 4.3.4 — unmaintained
    "RUSTSEC-2026-0372", # zvariant_derive 5.15.0 — unmaintained
    # 3. Build-time only, in a sherpa-onnx-sys download path SHERPA_ONNX_LIB_DIR skips
    "RUSTSEC-2026-0367", # zip 2.4.2 — SUID/SGID bits preserved on extraction
    "RUSTSEC-2026-0368", # zip 2.4.2 — extracted symlinks may point outside the destination
    "RUSTSEC-2026-0369", # zip 2.4.2 — Unix permissions applied through symlinks
    "RUSTSEC-2026-0429", # zip 2.4.2 — abort on a symlink entry with a large declared size
]
