name: CI

# The suite that HANDOVER.md asks to be run before every commit, so that "it
# passed locally" is a fact about the branch rather than about one machine.
#
# No data step is needed: `crates/hanzi-core/data/hanzi.bin.gz` is committed, so
# the embedded dataset is there from the first checkout. (It used to be
# generated-only, which meant CI would have had to download ~33 MB of upstream
# text and rebuild it before the workspace would even compile.)
#
# The runner is macOS because that is the platform the app is built and shipped
# for. On a Linux runner the Tauri crate needs the system WebKit/GTK development
# packages (libwebkit2gtk-4.1-dev and friends) before `cargo test --workspace`
# will build; see README.md, "Shipping a build".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The project scripts point cargo here; setting it for the job as well keeps
  # the cache action looking at the same directory the build actually uses.
  CARGO_TARGET_DIR: .cargo-target

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # `Cargo.lock` is committed, so the key should follow it and not the
          # whole workspace's mtimes.
          workspaces: ". -> .cargo-target"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # The one build input cargo does not obtain for itself. `sherpa-onnx-sys`
      # would otherwise download a prebuilt native archive from GitHub during
      # `cargo build`; this fetches it against a pinned digest instead. It is an
      # explicit step rather than something `with-cargo-env.sh` triggers, because
      # a build that silently falls back to the crate's own download is exactly
      # the thing the pinning exists to prevent.
      - name: Fetch the pinned speech library
        run: pnpm run fetch-sherpa

      # Enables hanzi-core's `prepare` feature, so the data-pipeline parsing is
      # covered by the same run as everything else.
      - name: Test
        run: pnpm test

      # The interface's own suite: the stroke animation's geometry, the tone
      # colouring's rules and markup, the transcript display — things the Rust
      # tests cannot see and the type-checker cannot judge.
      - name: Test the interface
        run: pnpm run test:web

      - name: Lint the Rust
        run: pnpm run check:rust

      - name: Type-check the interface
        run: pnpm run check:web

  # The dependency graphs, audited on every push rather than noticed in a push
  # message — which is how the four `rustls` advisories published on 14 October
  # 2026 were found: Dependabot had not reported them yet and `cargo audit` had.
  #
  # A job of its own for two reasons: a failure names itself, and an advisory
  # database that is briefly unreachable is not a reason to fail the tests.
  #
  # `cargo audit` runs with `-D warnings` against `.cargo/audit.toml`, which
  # ignores exactly two advisories — `glib` and `proc-macro-error`, one Linux-GTK
  # chain that no Apple, Android or Windows build contains — and therefore fails
  # on everything else, **including a new unmaintained or unsound warning**,
  # which is how those two arrived. The npm side is three lockfiles (the root and
  # the two apps), each audited where it lives; `pnpm audit` reads the lockfile,
  # so this job needs no install.
  audit:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      # `cargo install cargo-audit` builds from source and takes minutes on a
      # macOS runner, and the only thing wanted from it is one binary — so it is
      # cached, and installed only when the cache misses.
      - name: Cache cargo-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Install cargo-audit
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit --locked

      - name: Audit the Rust graph
        run: pnpm run audit:rust

      - name: Audit the JavaScript graphs
        run: pnpm run audit:web
