[package]
name = "nihongo-core"
description = "Offline kana and kanji data, stroke order and legibility grading for handwritten Japanese"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# The geometry engine. `hanzi-core`'s `geom`, `grade` and `raster` modules are
# language-neutral — they grade strokes against strokes and never look at the
# character — so the Japanese data layer reuses them rather than reimplementing
# the Hungarian pairing, the order analysis and the ink measures.
hanzi-core = { path = "../hanzi-core" }
serde.workspace = true
postcard.workspace = true
flate2.workspace = true

# Only the `prepare-kana`, `prepare-kanji`, `prepare-words` and `prepare-passages`
# binaries read the upstream files, so the app does not carry a JSON reader it
# never uses.
serde_json = { workspace = true, optional = true }

# Morphological analysis, for segmenting the reading passages. Optional and
# behind `tokenize`, because it is the heaviest thing in the Japanese part: it
# brings `lindera` (MIT) and the UniDic dictionary that `lindera-unidic` builds
# from a **134 MB** download, pinned by MD5.
#
# Its build script does **nothing** unless `LINDERA_BUILD_DICTIONARY_CACHE_DIR`
# names a cache directory (or `embed-unidic` is on), so a plain `cargo test` or
# `cargo clippy` never touches the network — see `scripts/fetch-unidic.sh`, which
# sets that variable deliberately and is the only thing that downloads.
lindera = { version = "6.2", optional = true }
lindera-unidic = { version = "6.2", optional = true }

[features]
prepare = ["dep:serde_json"]
# The passage pipeline, and nothing the app ships: the analyser runs at build time
# and the artifact carries the segmentation, so the app keeps its promise that
# nothing is downloaded and the 134 MB dictionary stays out of every clone.
tokenize = ["prepare", "dep:lindera", "dep:lindera-unidic"]

[[bin]]
name = "prepare-kana"
path = "src/bin/prepare_kana.rs"
required-features = ["prepare"]

# The kanji artifact is far larger than the kana one — a few megabytes against
# 71 KB — so it is generated and committed, not read at run time from anything
# upstream. See ROADMAP_NIHONGO.md N6 and `kanji.rs`.
[[bin]]
name = "prepare-kanji"
path = "src/bin/prepare_kanji.rs"
required-features = ["prepare"]

# The vocabulary, for the course that teaches characters through words. It reads
# the committed kanji artifact to decide what is teachable, so `prepare-kanji`
# runs first. See `words.rs` and ROADMAP_NIHONGO.md N7.
[[bin]]
name = "prepare-words"
path = "src/bin/prepare_words.rs"
required-features = ["prepare"]

# The reading passages, segmented by UniDic. Behind `tokenize` rather than
# `prepare` because the analyser is 100-odd crates and a 134 MB dictionary that
# only this binary needs; see `passages.rs` and scripts/fetch-unidic.sh.
[[bin]]
name = "prepare-passages"
path = "src/bin/prepare_passages.rs"
required-features = ["tokenize"]

# The graded phrases, imported from Tatoeba rather than written here, segmented by
# the same analyser the passages use and held to the same vocabulary — but by
# dropping a sentence the course cannot read rather than by refusing to write, since
# an imported sentence cannot be fixed. Behind `tokenize` for the passages' reason,
# and it reads what `scripts/fetch-tatoeba.sh` fetched. See `phrases.rs` and
# ROADMAP_NIHONGO.md N18.
[[bin]]
name = "prepare-phrases"
path = "src/bin/prepare_phrases.rs"
required-features = ["tokenize"]
