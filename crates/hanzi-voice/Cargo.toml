[package]
name = "hanzi-voice"
description = "Microphone capture and system speech synthesis, shared by the Hanzi Tutor apps"
version.workspace = true
edition.workspace = true
license.workspace = true

# The two things every app that scores tone needs and that neither the scoring
# engine nor the interface can own: a recorder that turns the microphone into
# samples, and a speaker that pronounces a character with the platform's own
# voice.
#
# It is a crate rather than a module in each app because a second app exists
# now — `apps/tone-trainer` — and the alternative was two thousand lines of
# platform code copied into it. Neither half is Tauri-specific in principle, but
# the Android backends go through a Kotlin plugin, so `tauri` is a real
# dependency rather than a convenience: see `platform`.
[dependencies]
hanzi-core = { path = "../hanzi-core" }
serde.workspace = true
serde_json.workspace = true
cpal = "0.18"
# The Kotlin plugin on Android is registered through Tauri's plugin API, and
# `register_android_plugin` is the only way to reach the Java side.
tauri = { version = "2", features = [] }

# iOS and macOS both speak in process through AVSpeechSynthesizer, which is
# an `objc2` binding already in the tree through Tauri (the audio session
# AVSpeechSynthesizer's iOS half also uses is AVFAudio too, but has no macOS
# equivalent — see the AVAudioSession-gated code in speech.rs, which stays
# iOS-only). AVFoundation's objects are not `Send`, so speech happens on the
# main thread and `dispatch2` is how the work gets there.
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-avf-audio = "0.3"
dispatch2 = "0.3"

# Only `engage_session`'s iOS-only async audio session activation needs this,
# for the completion-handler block `activateWithOptions_completionHandler`
# takes.
[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6"
